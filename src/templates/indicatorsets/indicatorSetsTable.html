{% load i18n %}
{% load crispy_forms_tags %}
{% load static %}
{% load dict_get %}
{% load split_filter %}
<!-- DataTables and mark.js stylesheets are loaded once, in index.html. -->
<div class="table-responsive table-container h-100">
    <table
        id="indicatorSetsTable"
        class="display cell-border table-striped table-bordered"
        width="100%"
    >
        <thead>
            <tr>
                <th class="text-center dt-select">Select</th>
                <th></th>
                <th class="text-center">
                    Name
                    <a
                        tabindex="0"
                        type="button"
                        class="info-button filter-description-popover"
                        data-mdb-container="body"
                        data-mdb-ripple-init
                        data-mdb-popover-init
                        data-mdb-trigger="hover"
                        data-mdb-placement="right"
                        data-mdb-content="{{ columns_descriptions|dict_get:'name' }}"
                    >
                        <i class="far fa-circle-question"></i>
                    </a>
                </th>
                <th class="text-center">
                    Pathogen(s)/
                    <br />
                    Syndrome(s)
                </th>
                <th class="text-center">
                    Geographic Levels
                    <a
                        tabindex="0"
                        type="button"
                        class="info-button filter-description-popover"
                        data-mdb-container="body"
                        data-mdb-ripple-init
                        data-mdb-popover-init
                        data-mdb-trigger="hover"
                        data-mdb-placement="right"
                        data-mdb-content="{{ columns_descriptions|dict_get:'geographic_levels' }}"
                    >
                        <i class="far fa-circle-question"></i>
                    </a>
                </th>
                <th class="text-center">
                    Temporal Scope End
                    <a
                        tabindex="0"
                        type="button"
                        class="info-button filter-description-popover"
                        data-mdb-container="body"
                        data-mdb-ripple-init
                        data-mdb-popover-init
                        data-mdb-trigger="hover"
                        data-mdb-placement="right"
                        data-mdb-content="{{ columns_descriptions|dict_get:'temporal_scope_end' }}"
                    >
                        <i class="far fa-circle-question"></i>
                    </a>
                </th>
                <th class="text-center">
                    Temporal Granularity
                    <a
                        tabindex="0"
                        type="button"
                        class="info-button filter-description-popover"
                        data-mdb-container="body"
                        data-mdb-ripple-init
                        data-mdb-popover-init
                        data-mdb-trigger="hover"
                        data-mdb-placement="right"
                        data-mdb-content="{{ columns_descriptions|dict_get:'temporal_granularity' }}"
                    >
                        <i class="far fa-circle-question"></i>
                    </a>
                </th>
                <th class="text-center">
                    Surveillance Categories
                    <a
                        tabindex="0"
                        type="button"
                        class="info-button filter-description-popover"
                        data-mdb-container="body"
                        data-mdb-ripple-init
                        data-mdb-popover-init
                        data-mdb-trigger="hover"
                        data-mdb-placement="right"
                        data-mdb-content="{{ columns_descriptions|dict_get:'surveillance_categories' }}"
                    >
                        <i class="far fa-circle-question"></i>
                    </a>
                </th>
                <th class="text-center">
                    Original Data Provider
                    <a
                        tabindex="0"
                        type="button"
                        class="info-button filter-description-popover"
                        data-mdb-container="body"
                        data-mdb-ripple-init
                        data-mdb-popover-init
                        data-mdb-trigger="hover"
                        data-mdb-placement="right"
                        data-mdb-content="{{ columns_descriptions|dict_get:'original_data_provider' }}"
                    >
                        <i class="far fa-circle-question"></i>
                    </a>
                </th>
            </tr>
        </thead>
        <tbody>
            <!-- Data loaded via AJAX -->
        </tbody>
    </table>
</div>
<!-- Loader Overlay -->
<div class="loader-overlay" id="loaderOverlay">
    <div class="lds-roller">
        <div></div>
        <div></div>
        <div></div>
        <div></div>
        <div></div>
        <div></div>
        <div></div>
        <div></div>
    </div>
</div>
<div class="float" id="showSelectedIndicatorsButton" style="display: none">
    <a
        type="button"
        class="btn btn-primary"
        data-mdb-ripple-init
        data-mdb-modal-init
        data-mdb-target="#selectedIndicatorsModal"
        >Show selected indicators</a
    >
</div>
<!-- Indicator set details, opened by clicking a set's name; filled by indicatorSetPanel.js -->
<dialog id="indicatorSetPanel" class="indicator-set-panel" aria-labelledby="indicatorSetPanelTitle">
    <header class="indicator-set-panel-header">
        <div class="indicator-set-panel-heading">
            <div class="indicator-set-panel-provider"></div>
            <h2 class="indicator-set-panel-title" id="indicatorSetPanelTitle"></h2>
            <div class="indicator-set-panel-tags"></div>
        </div>
        <button type="button" class="indicator-set-panel-close" aria-label="Close">
            <i class="fas fa-xmark" aria-hidden="true"></i>
        </button>
    </header>
    <div class="indicator-set-panel-body"></div>
    <footer class="indicator-set-panel-footer"></footer>
</dialog>
<script>
    window.relatedIndicators = null;
    window.numOfTimeseries = 0;
</script>
<script src="https://cdn.datatables.net/v/dt/dt-3.0.2/b-4.0.2/cr-3.0.1/cc-2.0.1/fc-6.0.0/fh-5.0.0/kt-3.0.0/r-4.0.2/rg-2.0.0/rr-2.0.0/sc-3.0.0/sl-4.0.1/datatables.min.js" integrity="sha384-AtuJGkIpd3MUyaXLwlVsKn+Ax3+FII96LgDV8glHnEijWhofjLJBmJil2mRbmxqY" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/g/mark.js(jquery.mark.min.js),datatables.mark.js"></script>
<script src="{% static 'js/indicatorSetsSelection.js' %}"></script>
<script src="{% static 'js/indicatorSetsTable.js' %}"></script>
<script src="{% static 'js/indicatorSetPanel.js' %}"></script>
<script src="{% static 'js/pluralize_word.js' %}"></script>
<script>
    var relatedIndicators = null;
    var numOfTimeseries = 0;

    function numberWithCommas(x) {
        return x.toString().replace(/\B(?=(\d{3})+(?!\d))/g, ",");
    }

    // Add event listener for opening and closing details
    $("#indicatorSetsTable tbody").on("click", "td.dt-control", function () {
        var tr = $(this).closest("tr");
        var row = table.row(tr);

        if (row.child.isShown()) {
            // This row is already open - close it
            row.child.hide();
        } else {
            // Open this row
            row.child(
                format(
                    row.data(),
                    relatedIndicators,
                ),
            ).show();
        }
    });

    $(document).ready(function () {
        // Fetch related indicators asynchronously
        $.ajax({
            url: "{% url 'get_related_indicators' %}" + window.location.search,
            method: "GET",
            success: function (response) {
                relatedIndicators = response.related_indicators;
                // Refresh any open rows now that data is loaded
                if (typeof table !== "undefined") {
                    table.rows().every(function () {
                        if (this.child.isShown()) {
                            this.child(
                                format(
                                    this.data(),
                                    relatedIndicators,
                                ),
                            ).show();
                        }
                    });
                }

                // Expand rows for selected indicators if any
                if (typeof expandSelectedRows === "function") {
                    expandSelectedRows();
                }
            },
            error: function (xhr, status, error) {
                console.error("Error fetching related indicators:", error);
            },
        });
    });
</script>
